name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: pip install -e .
      - name: Unit tests and offline harness checks (no API key)
        run: python -m unittest discover -s tests -t .
      - name: Regression gate (evidence survival and cost against the committed baseline)
        run: python -m longhaul.gate
